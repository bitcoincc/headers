<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bitcoin.cc - Compact Clients</title>
  <meta name="description" content="Compact Client infrastructure for Bitcoin. Headers, proofs, and lightweight verification.">
  <meta property="og:title" content="bitcoin.cc - Compact Clients">
  <meta property="og:description" content="Compact Clients for Bitcoin. Full verification, minimal footprint.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://bitcoin.cc">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="bitcoin.cc - Compact Clients">
  <meta name="twitter:description" content="Compact Clients for Bitcoin. Full verification, minimal footprint.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      padding: 2rem;
    }
    .container { max-width: 900px; margin: 0 auto; }
    header {
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    h1 { font-size: 2rem; font-weight: 400; margin-bottom: 0.25rem; }
    h1 span { color: #f7931a; }
    .header-left {}
    .tagline { color: #8b949e; font-size: 0.9rem; }
    .intro {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      color: #c9d1d9;
      font-size: 0.9rem;
    }
    .intro strong { color: #f7931a; }
    nav a {
      color: #8b949e;
      text-decoration: none;
      margin-left: 1.5rem;
    }
    nav a:hover { color: #e6edf3; }
    nav a.active { color: #f7931a; }
    .page-header {
      text-align: center;
      padding: 1rem 0 1.5rem;
      border-bottom: 1px solid #30363d;
      margin-bottom: 1.5rem;
    }
    .page-title { color: #f7931a; font-size: 1.25rem; margin-bottom: 0.25rem; }
    .page-subtitle { color: #8b949e; font-size: 0.85rem; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.25rem 0.75rem;
      background: #161b22;
      border-radius: 1rem;
      font-size: 0.75rem;
      margin-top: 0.75rem;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f85149;
    }
    .dot.connected { background: #3fb950; }
    .dot.connecting { background: #d29922; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.5; } }
    .tip-card {
      background: linear-gradient(135deg, #1a1f2e 0%, #161b22 100%);
      border: 1px solid #f7931a33;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .tip-height {
      font-size: 3rem;
      font-weight: bold;
      color: #f7931a;
    }
    .tip-label { color: #8b949e; font-size: 0.75rem; text-transform: uppercase; }
    .tip-hash {
      font-family: monospace;
      font-size: 0.7rem;
      word-break: break-all;
      margin-top: 0.5rem;
    }
    .tip-time { color: #8b949e; font-size: 0.85rem; margin-top: 0.5rem; }
    .energy-bar {
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding: 0.75rem;
      margin-bottom: 1.5rem;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      font-size: 0.75rem;
      color: #8b949e;
    }
    .energy-stat { display: flex; align-items: center; gap: 0.4rem; }
    .energy-stat strong { color: #f7931a; }
    .epoch-progress {
      margin-bottom: 1.5rem;
      padding: 0.75rem 1rem;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
    }
    .epoch-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #8b949e;
      margin-bottom: 0.5rem;
    }
    .epoch-header strong { color: #f7931a; }
    .epoch-bar {
      height: 6px;
      background: #30363d;
      border-radius: 3px;
      overflow: hidden;
    }
    .epoch-fill {
      height: 100%;
      background: linear-gradient(90deg, #f7931a 0%, #ffa500 100%);
      border-radius: 3px;
      transition: width 0.3s ease;
    }
    .headers-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .header-row {
      display: grid;
      grid-template-columns: 80px 1fr auto;
      gap: 1rem;
      padding: 0.75rem 1rem;
      background: #161b22;
      border-radius: 8px;
      border: 1px solid #30363d;
      align-items: center;
      font-size: 0.85rem;
    }
    .header-row:first-child {
      border-color: #f7931a55;
      background: #1a1a1a;
    }
    .header-height { font-weight: bold; color: #f7931a; }
    .header-hash {
      font-family: monospace;
      font-size: 0.75rem;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hash-zeros { color: #f7931a; }
    .hash-rest { color: #6e7681; }
    .header-time { color: #8b949e; font-size: 0.75rem; white-space: nowrap; }
    .info {
      margin-top: 1.5rem;
      padding: 1rem;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      font-size: 0.75rem;
      color: #8b949e;
    }
    .info code {
      background: #0d1117;
      padding: 0.1rem 0.3rem;
      border-radius: 3px;
      color: #c9d1d9;
    }
    .relays {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .relay-tag {
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      background: #0d1117;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .relay-dot { width: 6px; height: 6px; border-radius: 50%; }
    .loading { text-align: center; padding: 3rem; color: #8b949e; }
    .raw-btn {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      margin-top: 1rem;
    }
    .raw-btn:hover { background: #30363d; }
    .raw-event {
      margin-top: 1rem;
      padding: 1rem;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.7rem;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 400px;
      overflow-y: auto;
      color: #7ee787;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #30363d;
      border-top-color: #f7931a;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <a href="/" style="text-decoration: none; color: inherit;"><h1>bitcoin<span>.cc</span></h1></a>
        <p class="tagline">Compact Clients for Bitcoin</p>
      </div>
      <nav>
        <a href="/" class="active">Realtime</a>
        <a href="/explorer.html">Explorer</a>
        <a href="/mirrors.html">Mirrors</a>
        <a href="/about.html">About</a>
      </nav>
    </header>

    <div class="intro">
      <strong>Verify Bitcoin without a full node.</strong>
      Block headers are small (80 bytes) cryptographic proofs that let you confirm transactions
      without downloading 600GB+ of blockchain data. Watch live headers arrive via Nostr below.
    </div>

    <div id="app"></div>
  </div>

  <script type="module">
    import { h, render } from 'https://esm.sh/preact@10.19.3';
    import { useState, useEffect, useRef } from 'https://esm.sh/preact@10.19.3/hooks';
    import htm from 'https://esm.sh/htm@3.1.1';

    const html = htm.bind(h);

    const RELAYS = [
      'wss://relay.damus.io',
      'wss://nos.lol',
      'wss://relay.nostr.band',
      'wss://relay.nostr.net',
      'wss://relay.primal.net',
    ];

    const KIND_BITCOIN_HEADERS = 33333;
    const TRUSTED_PUBKEY = 'cccccccc829b802b7bf52d43edf7cfe62ac89f332a318b6826ac8bd6e73660da';

    function parseHeader(hex, index) {
      const offset = index * 160;
      const headerHex = hex.slice(offset, offset + 160);
      const bytes = new Uint8Array(80);
      for (let i = 0; i < 80; i++) {
        bytes[i] = parseInt(headerHex.slice(i * 2, i * 2 + 2), 16);
      }
      const view = new DataView(bytes.buffer);
      const prevHash = Array.from(bytes.slice(4, 36)).reverse().map(b => b.toString(16).padStart(2, '0')).join('');
      const merkleRoot = Array.from(bytes.slice(36, 68)).reverse().map(b => b.toString(16).padStart(2, '0')).join('');
      return {
        version: view.getUint32(0, true),
        prevHash,
        merkleRoot,
        timestamp: view.getUint32(68, true),
        bits: view.getUint32(72, true),
        nonce: view.getUint32(76, true),
        raw: headerHex
      };
    }

    async function computeHash(headerHex) {
      const bytes = new Uint8Array(80);
      for (let i = 0; i < 80; i++) {
        bytes[i] = parseInt(headerHex.slice(i * 2, i * 2 + 2), 16);
      }
      const hash1 = await crypto.subtle.digest('SHA-256', bytes);
      const hash2 = await crypto.subtle.digest('SHA-256', hash1);
      const hashArray = Array.from(new Uint8Array(hash2)).reverse();
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function formatTime(timestamp) {
      return new Date(timestamp * 1000).toLocaleString();
    }

    function timeAgo(timestamp) {
      const seconds = Math.floor(Date.now() / 1000) - timestamp;
      if (seconds < 60) return `${seconds}s ago`;
      if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
      if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
      return `${Math.floor(seconds / 86400)}d ago`;
    }

    function formatHash(hash) {
      const match = hash.match(/^(0+)(.*)$/);
      if (match) {
        return html`<span class="hash-zeros">${match[1]}</span><span class="hash-rest">${match[2]}</span>`;
      }
      return hash;
    }

    function App() {
      const [headers, setHeaders] = useState([]);
      const [relayStatus, setRelayStatus] = useState({});
      const [lastUpdate, setLastUpdate] = useState(null);
      const [eventMeta, setEventMeta] = useState(null);
      const [rawEvent, setRawEvent] = useState(null);
      const [showRaw, setShowRaw] = useState(false);
      const socketsRef = useRef({});
      const currentTipRef = useRef(0);

      useEffect(() => {
        RELAYS.forEach(url => {
          setRelayStatus(s => ({ ...s, [url]: 'connecting' }));
          const ws = new WebSocket(url);
          socketsRef.current[url] = ws;

          ws.onopen = () => {
            setRelayStatus(s => ({ ...s, [url]: 'connected' }));
            const sub = JSON.stringify([
              'REQ', 'headers',
              { kinds: [KIND_BITCOIN_HEADERS], authors: [TRUSTED_PUBKEY], '#d': ['latest'], '#n': ['btc'], limit: 1 }
            ]);
            ws.send(sub);
          };

          ws.onmessage = async (e) => {
            try {
              const msg = JSON.parse(e.data);
              if (msg[0] === 'EVENT' && msg[2]?.kind === KIND_BITCOIN_HEADERS) {
                const event = msg[2];
                const tags = Object.fromEntries(event.tags);
                // NIP-33333: tip tag + content contains headers ending at tip
                const tipHeight = parseInt(tags.tip, 10);
                const count = event.content.length / 160; // 80 bytes * 2 hex chars
                const startHeight = tipHeight - count + 1;

                // Only update if this event has a higher tip (use ref to avoid stale closure)
                if (tipHeight <= currentTipRef.current) {
                  console.log(`Skipping stale event (tip ${tipHeight} <= ${currentTipRef.current})`);
                  return;
                }

                const parsed = [];
                for (let i = 0; i < count; i++) {
                  const header = parseHeader(event.content, i);
                  header.height = startHeight + i;
                  header.hash = await computeHash(header.raw);
                  parsed.push(header);
                }
                parsed.reverse();

                currentTipRef.current = tipHeight;
                setHeaders(parsed);
                setLastUpdate(Date.now());
                setRawEvent(event);
                setEventMeta({
                  pubkey: event.pubkey.slice(0, 16) + '...',
                  created: event.created_at,
                  tip: tags.tip
                });
              }
            } catch (err) {
              console.error('Parse error:', err);
            }
          };

          ws.onclose = () => {
            setRelayStatus(s => ({ ...s, [url]: 'disconnected' }));
            setTimeout(() => {
              if (socketsRef.current[url]) {
                socketsRef.current[url] = new WebSocket(url);
              }
            }, 5000);
          };

          ws.onerror = () => {
            setRelayStatus(s => ({ ...s, [url]: 'error' }));
          };
        });

        return () => {
          Object.values(socketsRef.current).forEach(ws => ws.close());
        };
      }, []);

      const connectedCount = Object.values(relayStatus).filter(s => s === 'connected').length;
      const anyConnected = connectedCount > 0;
      const tip = headers[0];

      return html`
        <div class="page-header">
          <div class="page-title">Realtime Headers</div>
          <div class="page-subtitle">Live block headers via Nostr from trusted publisher</div>
          <div class="status">
            <span class="dot ${anyConnected ? 'connected' : 'connecting'}"></span>
            <span>${connectedCount}/${RELAYS.length} relays</span>
          </div>
        </div>

        ${!tip ? html`
          <div class="loading">
            <div class="spinner"></div>
            <div>Waiting for headers...</div>
          </div>
        ` : html`
          <div class="tip-card">
            <div class="tip-label">Latest Block</div>
            <div class="tip-height">${tip.height.toLocaleString()}</div>
            <div class="tip-hash">${formatHash(tip.hash)}</div>
            <div class="tip-time">${formatTime(tip.timestamp)} (${timeAgo(tip.timestamp)})</div>
          </div>

          <div class="energy-bar">
            <div class="energy-stat">
              <span>⚡</span>
              <span><strong>~$${(headers.length * 200000).toLocaleString()}</strong> energy</span>
            </div>
            <div class="energy-stat">
              <span>📦</span>
              <span><strong>${headers.length}</strong> blocks</span>
            </div>
            <div class="energy-stat">
              <span>💾</span>
              <span><strong>${(headers.length * 80).toLocaleString()}</strong> bytes</span>
            </div>
          </div>

          <div class="epoch-progress">
            <div class="epoch-header">
              <span>Epoch <strong>${Math.floor(tip.height / 2016)}</strong></span>
              <span><strong>${tip.height % 2016}</strong> / 2016 blocks</span>
            </div>
            <div class="epoch-bar">
              <div class="epoch-fill" style="width: ${((tip.height % 2016) / 2016 * 100).toFixed(1)}%"></div>
            </div>
          </div>

          <div class="headers-list">
            ${headers.map(h => html`
              <div class="header-row" key=${h.height}>
                <div class="header-height">${h.height.toLocaleString()}</div>
                <div class="header-hash">${formatHash(h.hash)}</div>
                <div class="header-time">${timeAgo(h.timestamp)}</div>
              </div>
            `)}
          </div>
        `}

        <div class="info">
          <div><strong>Protocol:</strong> <code>kind: 33333</code> <code>d: latest</code> <code>n: btc</code> (<a href="https://nip-333.github.io/" style="color: #58a6ff;">NIP-33333</a>)</div>
          <div style="margin-top: 0.5rem">
            <strong>Trusted Publisher:</strong> <a href="https://nostrcg.github.io/did-nostr/" style="color: #58a6ff; text-decoration: none;"><code style="font-size: 0.65rem">did:nostr:${TRUSTED_PUBKEY.slice(0,8)}...</code></a>
          </div>
          ${eventMeta ? html`
            <div style="margin-top: 0.5rem">
              <strong>Event from:</strong> <code>${eventMeta.pubkey}</code>
              updated ${timeAgo(eventMeta.created)}
            </div>
          ` : ''}
          <div class="relays">
            ${RELAYS.map(url => html`
              <span class="relay-tag" key=${url}>
                <span class="relay-dot" style="background: ${
                  relayStatus[url] === 'connected' ? '#3fb950' :
                  relayStatus[url] === 'connecting' ? '#d29922' : '#f85149'
                }"></span>
                ${url.replace('wss://', '')}
              </span>
            `)}
          </div>
          ${rawEvent ? html`
            <button class="raw-btn" onClick=${() => setShowRaw(!showRaw)}>
              ${showRaw ? 'Hide' : 'Show'} Raw Event
            </button>
            ${showRaw ? html`
              <pre class="raw-event">${JSON.stringify(rawEvent, null, 2)}</pre>
            ` : ''}
          ` : ''}
        </div>
      `;
    }

    render(html`<${App} />`, document.getElementById('app'));
  </script>
</body>
</html>
