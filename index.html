<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bitcoin.cc - Block Headers</title>
  <meta name="description" content="Bitcoin block headers by epoch. 2016 headers per difficulty period.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      padding: 2rem;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 400;
      margin-bottom: 0.25rem;
    }
    h1 span { color: #f7931a; }
    .tagline {
      color: #8b949e;
    }
    .stats {
      display: flex;
      gap: 2rem;
      margin: 1.5rem 0;
      flex-wrap: wrap;
    }
    .stat {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 1rem 1.5rem;
    }
    .stat-value {
      font-size: 1.5rem;
      color: #f7931a;
      font-weight: 500;
    }
    .stat-label {
      color: #8b949e;
      font-size: 0.875rem;
    }
    .epochs {
      display: grid;
      gap: 0.5rem;
    }
    .epoch {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 1rem 1.25rem;
      display: grid;
      grid-template-columns: 80px 1fr 1fr 120px;
      align-items: center;
      gap: 1rem;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .epoch:hover {
      border-color: #f7931a;
    }
    .epoch-num {
      font-size: 1.25rem;
      color: #f7931a;
    }
    .epoch-blocks, .epoch-time {
      color: #8b949e;
      font-size: 0.875rem;
    }
    .epoch-link {
      text-align: right;
    }
    .epoch-link a {
      color: #58a6ff;
      text-decoration: none;
      font-size: 0.875rem;
    }
    .epoch-link a:hover {
      text-decoration: underline;
    }
    .loading {
      color: #8b949e;
      padding: 2rem;
      text-align: center;
    }
    footer {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid #30363d;
      color: #484f58;
      font-size: 0.875rem;
      display: flex;
      justify-content: space-between;
    }
    footer a {
      color: #8b949e;
      text-decoration: none;
    }
    footer a:hover {
      color: #e6edf3;
    }
    @media (max-width: 600px) {
      .epoch {
        grid-template-columns: 1fr;
        gap: 0.5rem;
      }
      .epoch-link { text-align: left; }
      .stats { gap: 1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>bitcoin<span>.cc</span></h1>
      <p class="tagline">Block headers by epoch</p>
    </header>

    <div id="app">
      <div class="loading">Loading epochs...</div>
    </div>

    <footer>
      <span>2016 headers per epoch</span>
      <a href="https://github.com/bitcoincc/headers">GitHub</a>
    </footer>
  </div>

  <script type="module">
    import { h, render } from 'https://esm.sh/preact@10.19.3';
    import { useState, useEffect } from 'https://esm.sh/preact@10.19.3/hooks';
    import htm from 'https://esm.sh/htm@3.1.1';

    const html = htm.bind(h);

    function formatDate(timestamp) {
      return new Date(timestamp * 1000).toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      });
    }

    function App() {
      const [latest, setLatest] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        fetch('/headers/latest.json')
          .then(r => r.json())
          .then(data => {
            setLatest(data);
            setLoading(false);
          })
          .catch(() => setLoading(false));
      }, []);

      if (loading) {
        return html`<div class="loading">Loading...</div>`;
      }

      if (!latest) {
        return html`<div class="loading">No data available yet</div>`;
      }

      const epochs = Array.from({ length: latest.current_epoch + 1 }, (_, i) => i).reverse();

      return html`
        <div>
          <div class="stats">
            <div class="stat">
              <div class="stat-value">${latest.current_epoch + 1}</div>
              <div class="stat-label">Epochs</div>
            </div>
            <div class="stat">
              <div class="stat-value">${latest.tip_height.toLocaleString()}</div>
              <div class="stat-label">Block Height</div>
            </div>
          </div>

          <div class="epochs">
            ${epochs.map(epoch => html`
              <div class="epoch" key=${epoch}>
                <div class="epoch-num">#${epoch}</div>
                <div class="epoch-blocks">
                  Blocks ${(epoch * 2016).toLocaleString()} – ${((epoch + 1) * 2016 - 1).toLocaleString()}
                </div>
                <div class="epoch-time"></div>
                <div class="epoch-link">
                  <a href="/headers/epoch/${epoch}.json">JSON</a>
                </div>
              </div>
            `)}
          </div>
        </div>
      `;
    }

    render(html`<${App} />`, document.getElementById('app'));
  </script>
</body>
</html>
