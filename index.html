<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bitcoin.cc - Block Headers</title>
  <meta name="description" content="Bitcoin block headers by epoch. 2016 headers per difficulty period.">
  <meta property="og:title" content="bitcoin.cc - Block Headers">
  <meta property="og:description" content="Bitcoin block header infrastructure for SPV. 925k+ headers organized by difficulty epoch.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://bitcoin.cc">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="bitcoin.cc - Block Headers">
  <meta name="twitter:description" content="Bitcoin block header infrastructure for SPV. Finishing what Section 8 started.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      padding: 2rem;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .header-left {}
    h1 {
      font-size: 2rem;
      font-weight: 400;
      margin-bottom: 0.25rem;
    }
    h1 span { color: #f7931a; }
    .tagline {
      color: #8b949e;
    }
    nav a {
      color: #8b949e;
      text-decoration: none;
      margin-left: 1.5rem;
    }
    nav a:hover { color: #e6edf3; }
    .stats {
      display: flex;
      gap: 2rem;
      margin: 1.5rem 0;
      flex-wrap: wrap;
    }
    .stat {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 1rem 1.5rem;
    }
    .stat-value {
      font-size: 1.5rem;
      color: #f7931a;
      font-weight: 500;
    }
    .stat-label {
      color: #8b949e;
      font-size: 0.875rem;
    }
    .epochs {
      display: grid;
      gap: 0.5rem;
    }
    .epoch {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 1rem 1.25rem;
      display: grid;
      grid-template-columns: 80px 1fr 1fr 120px;
      align-items: center;
      gap: 1rem;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .epoch:hover {
      border-color: #f7931a;
    }
    a.epoch {
      text-decoration: none;
      color: inherit;
    }
    .epoch-num {
      font-size: 1.25rem;
      color: #f7931a;
    }
    .epoch-blocks, .epoch-time {
      color: #8b949e;
      font-size: 0.875rem;
    }
    .epoch-link {
      text-align: right;
    }
    .epoch-link a {
      color: #58a6ff;
      text-decoration: none;
      font-size: 0.875rem;
    }
    .epoch-link a:hover {
      text-decoration: underline;
    }
    .loading {
      color: #8b949e;
      padding: 2rem;
      text-align: center;
    }
    .section-title {
      color: #8b949e;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin: 1.5rem 0 0.75rem;
    }
    .section-title:first-of-type {
      margin-top: 0;
    }
    .epoch.current {
      border-color: #f7931a;
      background: #1c1f24;
    }
    .badge {
      background: #f7931a;
      color: #0d1117;
      font-size: 0.65rem;
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
      font-weight: 600;
      display: inline-block;
      margin-top: 0.25rem;
    }
    .epoch-count {
      color: #58a6ff;
      font-size: 0.8rem;
    }
    footer {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid #30363d;
      color: #484f58;
      font-size: 0.875rem;
      display: flex;
      justify-content: space-between;
    }
    footer a {
      color: #8b949e;
      text-decoration: none;
    }
    footer a:hover {
      color: #e6edf3;
    }
    @media (max-width: 600px) {
      .epoch {
        grid-template-columns: 1fr;
        gap: 0.5rem;
      }
      .epoch-link { text-align: left; }
      .stats { gap: 1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <a href="/" style="text-decoration: none; color: inherit;"><h1>bitcoin<span>.cc</span></h1></a>
        <p class="tagline">Block headers by epoch</p>
      </div>
      <nav>
        <a href="/">Explorer</a>
        <a href="/about.html">About</a>
      </nav>
    </header>

    <div id="app">
      <div class="loading">Loading epochs...</div>
    </div>

    <footer>
      <span>2016 headers per epoch</span>
      <a href="https://github.com/bitcoincc/headers">GitHub</a>
    </footer>
  </div>

  <script type="module">
    import { h, render } from 'https://esm.sh/preact@10.19.3';
    import { useState, useEffect } from 'https://esm.sh/preact@10.19.3/hooks';
    import htm from 'https://esm.sh/htm@3.1.1';

    const html = htm.bind(h);

    function formatDate(timestamp) {
      return new Date(timestamp * 1000).toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      });
    }

    function App() {
      const [latest, setLatest] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        fetch('/headers/latest.json')
          .then(r => r.json())
          .then(data => {
            setLatest(data);
            setLoading(false);
          })
          .catch(() => setLoading(false));
      }, []);

      if (loading) {
        return html`<div class="loading">Loading...</div>`;
      }

      if (!latest) {
        return html`<div class="loading">No data available yet</div>`;
      }

      const currentEpoch = latest.current_epoch;
      const archivedEpochs = Array.from({ length: latest.archived_epochs.count }, (_, i) => i).reverse();

      return html`
        <div>
          <div class="stats">
            <div class="stat">
              <div class="stat-value">${latest.archived_epochs.count.toLocaleString()}</div>
              <div class="stat-label">Archived Epochs</div>
            </div>
            <div class="stat">
              <div class="stat-value">${latest.tip.height.toLocaleString()}</div>
              <div class="stat-label">Block Height</div>
            </div>
            <div class="stat">
              <div class="stat-value">${Math.round(latest.tip.height * 80 / 1024 / 1024)} MB</div>
              <div class="stat-label">Header Chain</div>
            </div>
          </div>

          <div class="section-title">Current Epoch</div>
          <div class="epochs">
            <a href="/epoch.html?n=${currentEpoch.epoch}" class="epoch current">
              <div class="epoch-num">
                #${currentEpoch.epoch}
                <div class="badge">${currentEpoch.count}/2016</div>
              </div>
              <div class="epoch-blocks">
                Blocks ${currentEpoch.start_height.toLocaleString()} – ${latest.tip.height.toLocaleString()}
              </div>
              <div class="epoch-count">${currentEpoch.count} headers</div>
              <div class="epoch-link">
                <span>View →</span>
              </div>
            </a>
          </div>

          <div class="section-title">Archived Epochs (${latest.archived_epochs.count})</div>
          <div class="epochs">
            ${archivedEpochs.map(epoch => html`
              <a href="/epoch.html?n=${epoch}" class="epoch" key=${epoch}>
                <div class="epoch-num">#${epoch}</div>
                <div class="epoch-blocks">
                  Blocks ${(epoch * 2016).toLocaleString()} – ${((epoch + 1) * 2016 - 1).toLocaleString()}
                </div>
                <div class="epoch-count">2016 headers</div>
                <div class="epoch-link">
                  <span>View →</span>
                </div>
              </a>
            `)}
          </div>
        </div>
      `;
    }

    render(html`<${App} />`, document.getElementById('app'));
  </script>
</body>
</html>
