<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>(function(){var t=localStorage.getItem('theme');if(!t&&matchMedia('(prefers-color-scheme:dark)').matches)t='dark';if(t==='dark')document.documentElement.dataset.theme='dark'})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bitcoin.cc - Compact Clients</title>
  <meta name="description" content="Compact Client infrastructure for Bitcoin. Headers, proofs, and lightweight verification.">
  <meta property="og:title" content="bitcoin.cc - Compact Clients">
  <meta property="og:description" content="Compact Clients for Bitcoin. Full verification, minimal footprint.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://bitcoin.cc">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="bitcoin.cc - Compact Clients">
  <meta name="twitter:description" content="Compact Clients for Bitcoin. Full verification, minimal footprint.">
  <link rel="stylesheet" href="/theme.css">
  <style>
    .page-header {
      text-align: center;
      padding: 1rem 0 1.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }
    .page-title { color: var(--accent); font-size: 1.25rem; margin-bottom: 0.25rem; }
    .page-subtitle { color: var(--text-dim); font-size: 0.85rem; }
    .net-tabs { display: inline-flex; gap: 0.5rem; margin-top: 0.75rem; }
    .net-tab {
      background: var(--bg-code); color: var(--text-dim); border: 1px solid var(--border);
      border-radius: 1rem; padding: 0.25rem 0.9rem; font-size: 0.75rem; cursor: pointer;
    }
    .net-tab.active { color: var(--accent); border-color: var(--accent); }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.25rem 0.75rem;
      background: var(--bg-code);
      border-radius: 1rem;
      font-size: 0.75rem;
      margin-top: 0.75rem;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--error);
    }
    .dot.connected { background: var(--success); }
    .dot.connecting { background: var(--warning); animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.5; } }
    .tip-card {
      background: var(--accent-subtle);
      border: 1px solid var(--accent-border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .tip-height {
      font-size: 3rem;
      font-weight: bold;
      color: var(--accent);
      letter-spacing: -0.02em;
    }
    .tip-label { color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .tip-hash {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      word-break: break-all;
      margin-top: 0.5rem;
      color: var(--text-secondary);
    }
    .tip-time { color: var(--text-dim); font-size: 0.85rem; margin-top: 0.5rem; }
    .energy-bar {
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding: 0.75rem;
      margin-bottom: 1.5rem;
      border-top: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
      font-size: 0.8rem;
      color: var(--text-dim);
    }
    .energy-stat { display: flex; align-items: center; gap: 0.4rem; }
    .energy-stat strong { color: var(--accent); }
    .epoch-progress {
      margin-bottom: 1.5rem;
      padding: 0.75rem 0;
    }
    .epoch-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
    }
    .epoch-header strong { color: var(--accent); }
    .epoch-bar {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .epoch-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.3s ease;
    }
    .headers-list { display: flex; flex-direction: column; gap: 2px; }
    .header-row {
      display: grid;
      grid-template-columns: 80px 1fr auto;
      gap: 1rem;
      padding: 0.75rem 1rem;
      align-items: center;
      font-size: 0.85rem;
      border-radius: var(--radius);
      transition: background 0.1s;
    }
    .header-row:nth-child(odd) { background: var(--bg-card); }
    .header-row:hover { background: var(--bg-hover); }
    .header-row:first-child {
      border-left: 3px solid var(--accent);
      font-weight: 500;
    }
    .header-height { font-weight: bold; color: var(--accent); }
    .header-hash {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hash-zeros { color: var(--accent); }
    .hash-rest { color: var(--text-secondary); }
    .header-time { color: var(--text-secondary); font-size: 0.75rem; white-space: nowrap; }
    .info {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--text-dim);
    }
    .relays {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .relay-tag {
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      background: var(--bg-code);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-family: var(--font-mono);
    }
    .relay-dot { width: 6px; height: 6px; border-radius: 50%; }
    .raw-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 0.4rem 0.8rem;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.75rem;
      font-family: var(--font);
      margin-top: 1rem;
    }
    .raw-btn:hover { background: var(--bg-hover); }
    .raw-event {
      margin-top: 1rem;
      padding: 1rem;
      background: var(--bg-code);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 400px;
      overflow-y: auto;
      color: var(--raw-text);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <a href="/"><h1>bitcoin<span>.cc</span></h1></a>
        <p class="tagline">Compact Clients for Bitcoin</p>
      </div>
      <nav>
        <a href="/" class="active">Realtime</a>
        <a href="/explorer.html">Explorer</a>
        <a href="/mirrors.html">Mirrors</a>
        <a href="/about.html">About</a>
        <button class="theme-toggle" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';localStorage.setItem('theme',document.documentElement.dataset.theme)" aria-label="Toggle theme"><span class="theme-dark">&#9789;</span><span class="theme-light">&#9788;</span></button>
      </nav>
    </header>

    <div class="intro">
      <strong>Verify Bitcoin without a full node.</strong>
      Block headers are small (80 bytes) cryptographic proofs that let you confirm transactions
      without downloading 600GB+ of blockchain data. Watch live headers arrive via Nostr below.
    </div>

    <div id="app"></div>
  </div>

  <script type="module">
    import { h, render } from 'https://esm.sh/preact@10.19.3';
    import { useState, useEffect, useRef } from 'https://esm.sh/preact@10.19.3/hooks';
    import htm from 'https://esm.sh/htm@3.1.1';

    const html = htm.bind(h);

    const RELAYS = [
      'wss://relay.damus.io',
      'wss://nos.lol',
      'wss://relay.nostr.band',
      'wss://relay.nostr.net',
      'wss://relay.primal.net',
    ];

    const KIND_BITCOIN_HEADERS = 33333;
    const TRUSTED_PUBKEY = 'cccccccc829b802b7bf52d43edf7cfe62ac89f332a318b6826ac8bd6e73660da';

    function parseHeader(hex, index) {
      const offset = index * 160;
      const headerHex = hex.slice(offset, offset + 160);
      const bytes = new Uint8Array(80);
      for (let i = 0; i < 80; i++) {
        bytes[i] = parseInt(headerHex.slice(i * 2, i * 2 + 2), 16);
      }
      const view = new DataView(bytes.buffer);
      const prevHash = Array.from(bytes.slice(4, 36)).reverse().map(b => b.toString(16).padStart(2, '0')).join('');
      const merkleRoot = Array.from(bytes.slice(36, 68)).reverse().map(b => b.toString(16).padStart(2, '0')).join('');
      return {
        version: view.getUint32(0, true),
        prevHash,
        merkleRoot,
        timestamp: view.getUint32(68, true),
        bits: view.getUint32(72, true),
        nonce: view.getUint32(76, true),
        raw: headerHex
      };
    }

    async function computeHash(headerHex) {
      const bytes = new Uint8Array(80);
      for (let i = 0; i < 80; i++) {
        bytes[i] = parseInt(headerHex.slice(i * 2, i * 2 + 2), 16);
      }
      const hash1 = await crypto.subtle.digest('SHA-256', bytes);
      const hash2 = await crypto.subtle.digest('SHA-256', hash1);
      const hashArray = Array.from(new Uint8Array(hash2)).reverse();
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function formatTime(timestamp) {
      return new Date(timestamp * 1000).toLocaleString();
    }

    function timeAgo(timestamp) {
      const seconds = Math.floor(Date.now() / 1000) - timestamp;
      if (seconds < 60) return `${seconds}s ago`;
      if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
      if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
      return `${Math.floor(seconds / 86400)}d ago`;
    }

    function formatHash(hash) {
      const match = hash.match(/^(0+)(.*)$/);
      if (match) {
        return html`<span class="hash-zeros">${match[1]}</span><span class="hash-rest">${match[2]}</span>`;
      }
      return hash;
    }

    function App() {
      const [headers, setHeaders] = useState([]);
      const [relayStatus, setRelayStatus] = useState({});
      const [lastUpdate, setLastUpdate] = useState(null);
      const [eventMeta, setEventMeta] = useState(null);
      const [rawEvent, setRawEvent] = useState(null);
      const [showRaw, setShowRaw] = useState(false);
      const [net, setNet] = useState('btc'); // NIP-333 network code: btc | tbtc4
      const socketsRef = useRef({});
      const currentTipRef = useRef(0);

      useEffect(() => {
        // fresh slate per network: the streams are independent replaceable events
        currentTipRef.current = 0;
        setHeaders([]); setEventMeta(null); setRawEvent(null); setRelayStatus({});

        const connect = (url) => {
          setRelayStatus(s => ({ ...s, [url]: 'connecting' }));
          const ws = new WebSocket(url);
          socketsRef.current[url] = ws;

          ws.onopen = () => {
            setRelayStatus(s => ({ ...s, [url]: 'connected' }));
            const sub = JSON.stringify([
              'REQ', 'headers',
              { kinds: [KIND_BITCOIN_HEADERS], authors: [TRUSTED_PUBKEY], '#d': [net], limit: 1 }
            ]);
            ws.send(sub);
          };

          ws.onmessage = async (e) => {
            try {
              const msg = JSON.parse(e.data);
              if (msg[0] === 'EVENT' && msg[2]?.kind === KIND_BITCOIN_HEADERS) {
                const event = msg[2];
                const tags = Object.fromEntries(event.tags);
                const tipHeight = parseInt(tags.tip, 10);
                const count = event.content.length / 160;
                const startHeight = tipHeight - count + 1;

                if (tipHeight <= currentTipRef.current) {
                  console.log(`Skipping stale event (tip ${tipHeight} <= ${currentTipRef.current})`);
                  return;
                }

                const parsed = [];
                for (let i = 0; i < count; i++) {
                  const header = parseHeader(event.content, i);
                  header.height = startHeight + i;
                  header.hash = await computeHash(header.raw);
                  parsed.push(header);
                }
                parsed.reverse();

                currentTipRef.current = tipHeight;
                setHeaders(parsed);
                setLastUpdate(Date.now());
                setRawEvent(event);
                setEventMeta({
                  pubkey: event.pubkey.slice(0, 16) + '...',
                  created: event.created_at,
                  tip: tags.tip
                });
              }
            } catch (err) {
              console.error('Parse error:', err);
            }
          };

          ws.onclose = () => {
            setRelayStatus(s => ({ ...s, [url]: 'disconnected' }));
            // reconnect WITH handlers and subscription — a bare socket
            // would sit connected but silently stale
            setTimeout(() => {
              if (socketsRef.current[url] === ws) connect(url);
            }, 5000);
          };

          ws.onerror = () => {
            setRelayStatus(s => ({ ...s, [url]: 'error' }));
          };
        };

        RELAYS.forEach(connect);

        return () => {
          const sockets = socketsRef.current;
          socketsRef.current = {}; // disarm reconnects before closing
          Object.values(sockets).forEach(ws => { try { ws.close(); } catch (e) {} });
        };
      }, [net]);

      const connectedCount = Object.values(relayStatus).filter(s => s === 'connected').length;
      const anyConnected = connectedCount > 0;
      const tip = headers[0];

      return html`
        <div class="page-header">
          <div class="page-title">Realtime Headers</div>
          <div class="page-subtitle">Live block headers via Nostr from trusted publisher</div>
          <div class="status">
            <span class="dot ${anyConnected ? 'connected' : 'connecting'}"></span>
            <span>${connectedCount}/${RELAYS.length} relays</span>
          </div>
          <div class="net-tabs">
            <button class="net-tab ${net === 'btc' ? 'active' : ''}" onClick=${() => setNet('btc')}>mainnet</button>
            <button class="net-tab ${net === 'tbtc4' ? 'active' : ''}" onClick=${() => setNet('tbtc4')}>testnet4</button>
          </div>
        </div>

        ${!tip ? html`
          <div class="loading">
            <div class="spinner"></div>
            <div>Waiting for headers...</div>
          </div>
        ` : html`
          <div class="tip-card">
            <div class="tip-label">Latest Block</div>
            <div class="tip-height">${tip.height.toLocaleString()}</div>
            <div class="tip-hash">${formatHash(tip.hash)}</div>
            <div class="tip-time">${formatTime(tip.timestamp)} (${timeAgo(tip.timestamp)})</div>
          </div>

          <div class="energy-bar">
            ${net === 'btc' ? html`
              <div class="energy-stat">
                <span>\u26A1</span>
                <span><strong>~$${(headers.length * 200000).toLocaleString()}</strong> energy</span>
              </div>
            ` : ''}
            <div class="energy-stat">
              <span>\u{1F4E6}</span>
              <span><strong>${headers.length}</strong> blocks</span>
            </div>
            <div class="energy-stat">
              <span>\u{1F4BE}</span>
              <span><strong>${(headers.length * 80).toLocaleString()}</strong> bytes</span>
            </div>
          </div>

          <div class="epoch-progress">
            <div class="epoch-header">
              <span>Epoch <strong>${Math.floor(tip.height / 2016)}</strong></span>
              <span><strong>${tip.height % 2016}</strong> / 2016 blocks</span>
            </div>
            <div class="epoch-bar">
              <div class="epoch-fill" style="width: ${((tip.height % 2016) / 2016 * 100).toFixed(1)}%"></div>
            </div>
          </div>

          <div class="headers-list">
            ${headers.map(h => html`
              <div class="header-row" key=${h.height}>
                <div class="header-height">${h.height.toLocaleString()}</div>
                <div class="header-hash">${formatHash(h.hash)}</div>
                <div class="header-time">${timeAgo(h.timestamp)}</div>
              </div>
            `)}
          </div>
        `}

        <div class="info">
          <div><strong>Protocol:</strong> <code>kind: 33333</code> <code>d: ${net}</code> <code>n: ${net}</code> (<a href="https://nip-333.github.io/">NIP-333</a>)</div>
          <div style="margin-top: 0.5rem">
            <strong>Trusted Publisher:</strong> <a href="https://nostrcg.github.io/did-nostr/"><code style="font-size: 0.65rem">did:nostr:${TRUSTED_PUBKEY.slice(0,8)}...</code></a>
          </div>
          ${eventMeta ? html`
            <div style="margin-top: 0.5rem">
              <strong>Event from:</strong> <code>${eventMeta.pubkey}</code>
              updated ${timeAgo(eventMeta.created)}
            </div>
          ` : ''}
          <div class="relays">
            ${RELAYS.map(url => html`
              <span class="relay-tag" key=${url}>
                <span class="relay-dot" style="background: ${
                  relayStatus[url] === 'connected' ? 'var(--success)' :
                  relayStatus[url] === 'connecting' ? 'var(--warning)' : 'var(--error)'
                }"></span>
                ${url.replace('wss://', '')}
              </span>
            `)}
          </div>
          ${rawEvent ? html`
            <button class="raw-btn" onClick=${() => setShowRaw(!showRaw)}>
              ${showRaw ? 'Hide' : 'Show'} Raw Event
            </button>
            ${showRaw ? html`
              <pre class="raw-event">${JSON.stringify(rawEvent, null, 2)}</pre>
            ` : ''}
          ` : ''}
        </div>
      `;
    }

    render(html`<${App} />`, document.getElementById('app'));
  </script>
</body>
</html>
